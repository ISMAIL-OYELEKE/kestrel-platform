# On every pull request, runs terraform plan for dev and prod and posts the result on the pull
# request (brief item 7.2). It uses the read only plan role, so it can never change anything.
# Changes are applied only after merge, by deploy.yml.
name: terraform plan

on:
  pull_request:

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for an OIDC token, exchanged for AWS credentials
  pull-requests: write # lets the job comment on the pull request

jobs:
  plan:
    name: plan ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: terraform/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::768499314608:role/kestrel-github-plan
          aws-region: eu-west-1
      - name: Build the scorer package
        run: ../../app/build-lambda.sh
      - name: Plan
        id: plan
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          terraform init -input=false -backend-config=../envs/${{ matrix.environment }}/backend.hcl
          set +e
          # A pull request plan only reads state, so it takes no lock. Otherwise a plan on an open
          # pull request can hold the lock while a deploy on main tries to plan, and the deploy fails.
          terraform plan -input=false -no-color -detailed-exitcode -lock=false \
            -var-file=../envs/${{ matrix.environment }}/terraform.tfvars \
            -var api_image_tag="${HEAD_SHA::12}" -out=tfplan \
            > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          # Exit code 2 means "plan succeeded and there are changes", which is not a failure.
          if [ "$code" -eq 1 ]; then echo "result=failed" >> "$GITHUB_OUTPUT"; else echo "result=ok" >> "$GITHUB_OUTPUT"; fi
      # Brief item 10.2: fail the pull request if a resource would be created without the required tags.
      - name: Tag check
        if: steps.plan.outputs.result == 'ok'
        run: terraform show -json tfplan > plan.json && ../../scripts/check-tags.sh plan.json
      - name: Post the plan on the pull request
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          RESULT: ${{ steps.plan.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- terraform-plan-${env} -->`;
            let plan = fs.readFileSync('terraform/platform/plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['See the job log'])[0];
            if (plan.length > 60000) plan = '...(start cut, full plan in the job log)\n' + plan.slice(-60000);
            const body = [
              marker,
              `### Terraform plan: ${env} ${process.env.RESULT === 'ok' ? '' : '(FAILED)'}`,
              `**${summary}**`,
              `Commit ${context.payload.pull_request.head.sha.slice(0, 12)}. Applied only after merge.`,
              '<details><summary>Full plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail if the plan failed
        if: steps.plan.outputs.result == 'failed'
        run: exit 1
