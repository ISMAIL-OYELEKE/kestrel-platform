# Checks that need no AWS access: app lint and tests, Terraform format and validation, and the
# Checkov scan of all Terraform (brief items 7.1 and 7.5). Runs on every pull request, and is
# called by deploy.yml before anything is deployed.
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    name: app lint and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kestrel
          POSTGRES_PASSWORD: kestrel
          POSTGRES_DB: kestrel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kestrel" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit and database tests
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql://kestrel:kestrel@localhost:5432/kestrel

  terraform:
    name: terraform format and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - name: Format
        run: terraform fmt -check -recursive
      # Validation reads the scorer package, so build it first.
      - name: Build the scorer package
        run: app/build-lambda.sh
      - name: Validate every stack
        run: |
          for stack in bootstrap terraform/account terraform/platform; do
            echo "== $stack"
            terraform -chdir=$stack init -backend=false -input=false >/dev/null
            terraform -chdir=$stack validate
          done

  checkov:
    name: checkov IaC scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install checkov==3.2.474
      # Fails on any finding. Every accepted finding is skipped in the code, next to the resource,
      # with its reason (#checkov:skip=ID:reason), and is listed in this job's output.
      - name: Scan
        run: checkov -d terraform -d bootstrap --framework terraform --quiet --compact
