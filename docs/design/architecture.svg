<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:bold;fill:#111827}
      .s{font-size:12.5px;fill:#374151}
      .h{font-size:13px;font-weight:bold;fill:#4b5563;letter-spacing:.5px}
      .box{fill:#fff;stroke:#374151;stroke-width:1.4;rx:8}
      .flow{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#a)}
      .ctl{stroke:#6b7280;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#ag)}
      .num{fill:#1d4ed8}
      .numt{fill:#fff;font-size:13px;font-weight:bold}
      .lock{fill:#b45309;font-size:12px;font-weight:bold}
      .tls{fill:#047857;font-size:12px;font-weight:bold}
    </style>
  </defs>
  <rect width="1800" height="1260" fill="#ffffff"/>

  <text x="40" y="44" font-size="26" font-weight="bold" fill="#111827">Kestrel loan platform on AWS: production</text>
  <text x="40" y="70" class="s">Account 768499314608, region eu-west-1 (Ireland). Dev is the same code with different variables (one AZ for endpoints, smaller tasks, single AZ database).</text>

  <!-- Legend -->
  <g transform="translate(1290,22)">
    <rect width="470" height="78" fill="#f9fafb" stroke="#d1d5db" rx="6"/>
    <line x1="14" y1="22" x2="54" y2="22" class="flow"/><text x="62" y="26" class="s">Request and data flow (numbered in order)</text>
    <line x1="14" y1="44" x2="54" y2="44" class="ctl"/><text x="62" y="48" class="s">Control, deploy and audit paths</text>
    <text x="14" y="69" class="tls">TLS</text><text x="44" y="69" class="s">encrypted in transit</text>
    <text x="200" y="69" class="lock">KMS</text><text x="234" y="69" class="s">encrypted at rest (key named)</text>
  </g>

  <!-- Internet side -->
  <rect x="40" y="150" width="190" height="96" class="box"/>
  <text x="58" y="180" class="t">Customers</text>
  <text x="58" y="202" class="s">Web and mobile apps</text>
  <text x="58" y="222" class="s">180,000 customers</text>

  <rect x="40" y="430" width="190" height="120" class="box"/>
  <text x="58" y="460" class="t">GitHub Actions</text>
  <text x="58" y="482" class="s">Lint, test, build, scan</text>
  <text x="58" y="502" class="s">Plan on PR, apply on merge</text>
  <text x="58" y="522" class="s">Prod needs approval issue</text>
  <text x="58" y="540" class="s">No stored AWS keys</text>

  <rect x="40" y="640" width="190" height="96" class="box"/>
  <text x="58" y="670" class="t">Operators (3)</text>
  <text x="58" y="692" class="s">Alarm email, dashboard,</text>
  <text x="58" y="712" class="s">runbook (docs/runbook.md)</text>

  <!-- Region -->
  <rect x="280" y="120" width="1480" height="1100" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="12"/>
  <text x="300" y="146" class="h">AWS REGION eu-west-1</text>

  <!-- VPC -->
  <rect x="300" y="160" width="900" height="740" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8" rx="10"/>
  <text x="318" y="186" class="h">VPC 10.30.0.0/16 (no NAT gateway, no internet route from private or isolated subnets)</text>
  <text x="520" y="212" class="h">AVAILABILITY ZONE eu-west-1a</text>
  <text x="900" y="212" class="h">AVAILABILITY ZONE eu-west-1b</text>
  <line x1="770" y1="200" x2="770" y2="890" stroke="#a5b4fc" stroke-dasharray="4 4"/>

  <!-- Public subnets -->
  <rect x="316" y="222" width="868" height="150" fill="#ecfdf5" stroke="#10b981" rx="8"/>
  <text x="330" y="242" class="h">PUBLIC SUBNETS 10.30.0.0/24, 10.30.1.0/24</text>
  <rect x="420" y="256" width="660" height="100" class="box"/>
  <text x="440" y="284" class="t">Application Load Balancer (both AZs)</text>
  <text x="440" y="306" class="s">HTTPS 443, TLS 1.3 and 1.2 (restricted ciphers). Port 80 only redirects to HTTPS.</text>
  <text x="440" y="326" class="s">Certificate in ACM (self signed until the client gives a domain, ADR 0008)</text>
  <text x="440" y="346" class="s">Health checks on GET /health</text>
  <rect x="330" y="262" width="78" height="86" fill="#fef3c7" stroke="#b45309" rx="6"/>
  <text x="346" y="290" class="t">WAF</text>
  <text x="338" y="310" class="s">3 AWS rule</text>
  <text x="338" y="326" class="s">groups, rate</text>
  <text x="338" y="342" class="s">limit per IP</text>

  <!-- Private subnets -->
  <rect x="316" y="386" width="868" height="300" fill="#eff6ff" stroke="#3b82f6" rx="8"/>
  <text x="330" y="406" class="h">PRIVATE SUBNETS 10.30.10.0/24, 10.30.11.0/24</text>
  <rect x="332" y="418" width="420" height="104" class="box"/>
  <text x="348" y="444" class="t">ECS Fargate: loan API tasks</text>
  <text x="348" y="466" class="s">0.5 vCPU, 1 GB, non root user. 2 to 20 tasks across both AZs</text>
  <text x="348" y="486" class="s">Scales on requests per task and CPU; floor of 5 on 25th to 28th</text>
  <text x="348" y="506" class="s">Own task role: encrypt and hash BVN, never decrypt</text>
  <rect x="788" y="418" width="380" height="104" class="box"/>
  <text x="804" y="444" class="t">Lambda: scorer</text>
  <text x="804" y="466" class="s">Network interfaces in both AZs, at most 5 at once</text>
  <text x="804" y="486" class="s">Approve if amount is at most 3 x salary</text>
  <text x="804" y="506" class="s">Row lock makes a repeated message harmless</text>
  <rect x="332" y="540" width="836" height="132" fill="#ffffff" stroke="#6b7280" stroke-dasharray="5 3" rx="8"/>
  <text x="348" y="564" class="t">VPC endpoints (one per service in each AZ): the only way out of the private subnets</text>
  <text x="348" y="588" class="s">Interface endpoints: ecr.api, ecr.dkr, logs, secretsmanager, kms, sqs, sns. Security group allows HTTPS from the VPC only.</text>
  <text x="348" y="610" class="s">S3 gateway endpoint (free): image layers and the artifacts bucket (ADR 0006).</text>
  <text x="348" y="636" class="tls">TLS</text><text x="378" y="636" class="s">on every call to an AWS service. A compromised task cannot reach the internet to send data out.</text>
  <text x="348" y="658" class="s">Fixed cost about USD 112 a month in prod instead of NAT gateways and their data charges.</text>

  <!-- Isolated subnets -->
  <rect x="316" y="700" width="868" height="186" fill="#fff7ed" stroke="#f97316" rx="8"/>
  <text x="330" y="720" class="h">ISOLATED DATABASE SUBNETS 10.30.20.0/24, 10.30.21.0/24</text>
  <rect x="332" y="732" width="420" height="140" class="box"/>
  <text x="348" y="758" class="t">RDS PostgreSQL 16: primary</text>
  <text x="348" y="780" class="s">db.t4g.micro, gp3 storage, not public</text>
  <text x="348" y="800" class="s">Accepts connections only from the API and scorer</text>
  <text x="348" y="820" class="s">Backups 7 days, point in time restore (RPO about 5 min)</text>
  <text x="348" y="842" class="lock">KMS</text><text x="380" y="842" class="s">data key. BVN stored only as ciphertext plus HMAC.</text>
  <text x="348" y="862" class="tls">TLS</text><text x="378" y="862" class="s">required (rds.force_ssl = 1)</text>
  <rect x="788" y="732" width="380" height="140" class="box"/>
  <text x="804" y="758" class="t">RDS standby (Multi-AZ)</text>
  <text x="804" y="780" class="s">Synchronous copy of the primary</text>
  <text x="804" y="800" class="s">Automatic failover in 1 to 2 minutes</text>
  <text x="804" y="820" class="s">if eu-west-1a or the primary fails</text>
  <text x="804" y="842" class="lock">KMS</text><text x="836" y="842" class="s">data key</text>
  <line x1="752" y1="800" x2="786" y2="800" stroke="#1f2937" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Regional services column -->
  <text x="1230" y="186" class="h">REGIONAL SERVICES (reached through the endpoints)</text>
  <rect x="1230" y="200" width="510" height="96" class="box"/>
  <text x="1246" y="226" class="t">SQS scoring queue + dead-letter queue</text>
  <text x="1246" y="248" class="s">A message per application. After 3 failed tries it moves to the DLQ;</text>
  <text x="1246" y="268" class="s">any message there raises an alarm.</text>
  <text x="1246" y="286" class="lock">SSE</text><text x="1278" y="286" class="s">SQS managed encryption</text>

  <rect x="1230" y="310" width="510" height="76" class="box"/>
  <text x="1246" y="336" class="t">SNS loan decisions topic</text>
  <text x="1246" y="356" class="s">Other teams subscribe without code changes.</text>
  <text x="1246" y="376" class="lock">KMS</text><text x="1278" y="376" class="s">AWS managed SNS key</text>

  <rect x="1230" y="400" width="510" height="118" class="box"/>
  <text x="1246" y="426" class="t">KMS customer managed keys</text>
  <text x="1246" y="448" class="s">data: database, its password secret, backups</text>
  <text x="1246" y="468" class="s">bvn-encrypt: BVN ciphertext (no role can decrypt today)</text>
  <text x="1246" y="488" class="s">bvn-mac: HMAC lookup hash, key never leaves KMS (ADR 0007)</text>
  <text x="1246" y="508" class="s">Yearly rotation (except HMAC), 7 day deletion wait, uses logged</text>

  <rect x="1230" y="532" width="510" height="76" class="box"/>
  <text x="1246" y="558" class="t">Secrets Manager</text>
  <text x="1246" y="578" class="s">Database password created and rotated every 7 days by RDS.</text>
  <text x="1246" y="598" class="s">Not in code, env files or Terraform state.</text>

  <rect x="1230" y="622" width="510" height="76" class="box"/>
  <text x="1246" y="648" class="t">ECR image repository</text>
  <text x="1246" y="668" class="s">Scan on push; pipeline stops on a critical finding.</text>
  <text x="1246" y="688" class="lock">AES</text><text x="1278" y="688" class="s">AES-256 at rest (code, no customer data)</text>

  <rect x="1230" y="712" width="510" height="174" class="box"/>
  <text x="1246" y="738" class="t">CloudWatch</text>
  <text x="1246" y="760" class="s">JSON logs with one request ID from API to queue to scorer.</text>
  <text x="1246" y="780" class="s">BVN masked; request bodies never logged. 30 day retention.</text>
  <text x="1246" y="800" class="s">Dashboard: requests, errors, p95, queue, DLQ, database.</text>
  <text x="1246" y="820" class="s">Alarms: 5xx rate, p95 latency, any DLQ message, low storage,</text>
  <text x="1246" y="840" class="s">each linked to a runbook entry. Also VPC Flow Logs, WAF logs.</text>
  <text x="1246" y="866" class="s">Alarm topic (SNS) sends email to the operators.</text>

  <!-- Governance band -->
  <rect x="300" y="920" width="1440" height="280" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4" rx="10"/>
  <text x="318" y="946" class="h">ACCOUNT GOVERNANCE AND SECURITY (terraform/account and bootstrap, applied once)</text>
  <rect x="316" y="960" width="330" height="124" class="box"/>
  <text x="332" y="986" class="t">CloudTrail (all regions)</text>
  <text x="332" y="1008" class="s">Who did what, including every KMS use.</text>
  <text x="332" y="1028" class="s">Log file validation on.</text>
  <rect x="664" y="960" width="350" height="124" class="box"/>
  <text x="680" y="986" class="t">S3 audit log bucket</text>
  <text x="680" y="1008" class="s">Application roles cannot write or delete.</text>
  <text x="680" y="1028" class="s">Only named log admins can delete.</text>
  <text x="680" y="1050" class="lock">KMS</text><text x="712" y="1050" class="s">cloudtrail key, versioning on</text>
  <rect x="1032" y="960" width="330" height="124" class="box"/>
  <text x="1048" y="986" class="t">GuardDuty, Security Hub, Config</text>
  <text x="1048" y="1008" class="s">Threat detection and the AWS</text>
  <text x="1048" y="1028" class="s">Foundational Security Best Practices</text>
  <text x="1048" y="1048" class="s">checks (90% on 16 Oct, gaps explained)</text>
  <rect x="1380" y="960" width="344" height="124" class="box"/>
  <text x="1396" y="986" class="t">Deploy access and cost</text>
  <text x="1396" y="1008" class="s">OIDC roles: plan, deploy dev, deploy prod</text>
  <text x="1396" y="1028" class="s">Terraform state in S3, encrypted, locked</text>
  <text x="1396" y="1048" class="s">AWS Budget USD 40 with email alerts</text>
  <text x="1396" y="1068" class="s">Tags: Environment, Owner, CostCenter</text>
  <text x="318" y="1118" class="s">Every resource is created by Terraform from one root module (terraform/platform). Prod differs from dev only in terraform/envs/prod/terraform.tfvars.</text>
  <text x="318" y="1140" class="s">Account settings: EBS encryption by default, S3 public access blocked for the whole account, IAM password policy, no public sharing of SSM documents.</text>
  <text x="318" y="1162" class="s">Nothing runs outside eu-west-1. Dashboards are a global console view of eu-west-1 metrics.</text>

  <!-- Flows -->
  <!-- 1 customers to WAF/ALB -->
  <path d="M230,198 L300,198 L300,250 L330,280" class="flow"/>
  <circle cx="262" cy="198" r="11" class="num"/><text x="258" y="203" class="numt">1</text>
  <text x="246" y="226" class="tls">TLS</text>
  <!-- 2 ALB to tasks -->
  <path d="M700,356 L700,416" class="flow"/>
  <circle cx="680" cy="376" r="11" class="num"/><text x="676" y="381" class="numt">2</text>
  <!-- 3 tasks to RDS -->
  <path d="M740,522 L740,538 M740,672 L740,730" class="flow"/>
  <circle cx="720" cy="686" r="11" class="num"/><text x="716" y="691" class="numt">3</text>
  <!-- 4 tasks to KMS and SQS via endpoints -->
  <path d="M560,522 L560,531 L1186,531 L1186,250 L1228,250" class="flow"/>
  <circle cx="900" cy="531" r="11" class="num"/><text x="896" y="536" class="numt">4</text>
  <path d="M1186,500 L1228,500" class="flow"/>
  <!-- 5 SQS to Lambda -->
  <path d="M1230,280 L1110,280 L1110,416" class="flow"/>
  <circle cx="1130" cy="330" r="11" class="num"/><text x="1126" y="335" class="numt">5</text>
  <!-- 6 Lambda to RDS -->
  <path d="M980,522 L980,538 M980,672 L980,730" class="flow"/>
  <circle cx="1002" cy="686" r="11" class="num"/><text x="998" y="691" class="numt">6</text>
  <!-- 7 Lambda to SNS -->
  <path d="M1168,440 L1210,440 L1210,350 L1228,350" class="flow"/>
  <circle cx="1210" cy="400" r="11" class="num"/><text x="1206" y="405" class="numt">7</text>

  <!-- Control paths -->
  <path d="M230,490 L272,490 L272,1100 L1552,1100 L1552,1088" class="ctl"/>
  <text x="1060" y="1096" class="s">GitHub OIDC: short lived deploy role, no stored keys</text>
  <path d="M1740,800 L1765,800 L1765,1240 L22,1240 L22,688 L38,688" class="ctl"/>
  <text x="900" y="1232" class="s">Alarm email to operators</text>
  <path d="M646,1022 L662,1022" class="ctl"/>

  <!-- Flow key -->
  <g transform="translate(40,780)">
    <rect width="226" height="410" fill="#f9fafb" stroke="#d1d5db" rx="6"/>
    <text x="12" y="24" class="t">Flow of one application</text>
    <text x="12" y="50" class="s">1  Customer sends POST</text>
    <text x="12" y="68" class="s">    /applications over HTTPS;</text>
    <text x="12" y="86" class="s">    WAF filters it</text>
    <text x="12" y="112" class="s">2  ALB forwards to a task</text>
    <text x="12" y="130" class="s">    inside the VPC</text>
    <text x="12" y="156" class="s">3  Task stores the application</text>
    <text x="12" y="174" class="s">    as PENDING, BVN encrypted</text>
    <text x="12" y="200" class="s">4  Task calls KMS for the BVN</text>
    <text x="12" y="218" class="s">    and puts a message on SQS</text>
    <text x="12" y="244" class="s">5  SQS triggers the scorer</text>
    <text x="12" y="270" class="s">6  Scorer locks the row and</text>
    <text x="12" y="288" class="s">    saves the decision</text>
    <text x="12" y="314" class="s">7  Scorer publishes the</text>
    <text x="12" y="332" class="s">    decision to SNS</text>
    <text x="12" y="358" class="s">Customer polls GET</text>
    <text x="12" y="376" class="s">/applications/{id}: seconds,</text>
    <text x="12" y="394" class="s">not overnight</text>
  </g>
</svg>
